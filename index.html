<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catch Him!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Lilita+One&display=swap">
<style>
:root{
  color-scheme: light;
  --sky:#5CC8FF; --blue:#1F4FD1; --navy:#14286B; --red:#FF3B3B; --sun:#FFD23F;
  --ink:#1B1F3B; --paper:#FFF8E6; --grass:#3DBE5A; --orange:#FF6A2B;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --body:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
img{max-width:100%}
body{background:var(--navy);color:var(--ink);font-family:var(--body);font-size:18px;overflow:hidden;
  padding-inline:16px;padding-block:10px;box-sizing:border-box;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
#app{position:relative;height:100%;max-width:1000px;margin:0 auto;border:4px solid var(--ink);border-radius:22px;
  overflow:hidden;background:var(--sky);display:flex;flex-direction:column}

/* big chunky buttons */
.big{font-family:var(--display);font-size:clamp(22px,5vw,30px);letter-spacing:.5px;background:var(--sun);color:var(--ink);
  border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:10px 26px;transition:transform .06s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.big.red{background:var(--red);color:#fff}
.big.blue{background:var(--blue);color:#fff}

/* HUD */
#hud{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--navy);color:#fff;flex-wrap:wrap}
#lvl{font-family:var(--display);font-size:20px;letter-spacing:.5px;white-space:nowrap}
#steps{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.step{width:26px;height:26px;flex:none;border-radius:50%;background:#2c3f86;border:3px solid #fff;display:grid;place-items:center;font-size:15px}
.step.done{background:var(--grass)}
.step.jailstep{border-radius:8px;background:#555}
#meterWrap{flex:1;min-width:120px;display:flex;align-items:center;gap:8px}
#meterWrap span{font-weight:800;font-size:15px;white-space:nowrap}
#meter{flex:1;height:16px;border-radius:10px;background:#2c3f86;border:3px solid #fff;overflow:hidden}
#meterFill{height:100%;width:10%;background:linear-gradient(90deg,var(--sun),var(--red));transition:width .15s}
#mute{background:none;border:3px solid #fff;border-radius:12px;width:40px;height:36px;font-size:18px;color:#fff}

#stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#controls{padding:10px 12px 12px;background:var(--grass);border-top:4px solid var(--ink)}
#runBtn{width:100%;font-size:clamp(28px,7vw,40px);padding:12px}

#banner{position:absolute;left:50%;top:18%;transform:translateX(-50%);background:var(--paper);border:4px solid var(--ink);
  border-radius:20px;padding:12px 24px;text-align:center;box-shadow:0 6px 0 var(--ink);width:max-content;max-width:90%}
#banner b{display:block;font-family:var(--display);font-size:clamp(26px,6vw,38px);font-weight:400;color:var(--blue)}

/* overlays */
.overlay{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:14px;overflow:auto;background:rgba(20,40,107,.88)}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);width:min(560px,100%);
  padding:16px 18px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.mtitle{font-family:var(--display);font-size:clamp(28px,6vw,38px);color:var(--red);line-height:1}
.hint{font-weight:700;font-size:19px;line-height:1.25;text-wrap:balance}
#mprog{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pip{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.pip.on{background:var(--sun);animation:pop .25s}
#area{position:relative;width:100%;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.yay{font-family:var(--display);font-size:44px;color:var(--grass);animation:pop .4s}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* WANTED poster (title) */
#title{background:radial-gradient(circle at 50% 30%,#2a52d9,var(--navy))}
.poster{background:#F3DDA7;border:4px solid var(--ink);border-radius:6px;box-shadow:0 8px 0 var(--ink);width:min(420px,100%);
  padding:14px 18px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;transform:rotate(-1.5deg)}
.wanted{font-family:var(--display);font-size:clamp(48px,13vw,72px);line-height:.9;color:#7A2E12;letter-spacing:2px}
.sub{font-family:var(--display);font-size:18px;color:#7A2E12;letter-spacing:3px}
.mug{width:150px;height:175px;border:4px solid var(--ink);background:#fff;display:grid;place-items:center;overflow:hidden;border-radius:4px}
.mug img{width:92%;animation:wobble 1.6s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.poster label{font-weight:800;font-size:17px;color:#7A2E12}
.faceBtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.poster .fbtn{font-family:var(--body);font-weight:800;font-size:16px;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:12px;padding:4px 12px;box-shadow:0 3px 0 var(--ink);cursor:pointer}
.poster .fbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
#edCv{width:200px;height:246px;max-width:100%;touch-action:none;cursor:grab;border-radius:50%;
  background:repeating-conic-gradient(#e4e7ef 0 25%,#fff 0 50%) 0 0/20px 20px;border:4px solid var(--ink)}
.zoomRow{display:flex;align-items:center;gap:8px;font-size:24px;width:min(260px,100%)}
.zoomRow input{flex:1;accent-color:var(--red)}
#nameIn{font-family:var(--display);font-size:24px;text-align:center;width:100%;max-width:260px;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;background:#fff}
.reward{font-family:var(--display);font-size:22px;color:#7A2E12}
.how{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;color:#fff;font-weight:700;font-size:16px}
.how div{background:rgba(255,255,255,.12);border-radius:14px;padding:6px 12px}
.titleWrap{display:flex;flex-direction:column;align-items:center;gap:16px}

/* wall */
.wall{width:min(300px,90%);height:200px;border:4px solid var(--ink);border-radius:8px;position:relative;
  background-color:#C8553D;
  background-image:linear-gradient(#EFD9C3 3px,transparent 3px),linear-gradient(90deg,#EFD9C3 3px,transparent 3px),linear-gradient(90deg,#EFD9C3 3px,transparent 3px);
  background-size:100% 34px,60px 68px,60px 68px;background-position:0 0,0 0,30px 34px;--c:0}
.wall .cracks{position:absolute;inset:0;width:100%;height:100%;opacity:var(--c);stroke:var(--ink);stroke-width:2.5;fill:none}
.wall.hit{animation:shake .12s}
.wall.smash{animation:smash .5s forwards}
@keyframes smash{to{transform:scale(1.3) rotate(8deg);opacity:0}}

/* maths */
.sum{font-family:var(--display);font-size:clamp(48px,12vw,70px);color:var(--blue)}
.opts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.opt{font-family:var(--display);font-size:40px;width:96px;height:96px;border:4px solid var(--ink);border-radius:20px;background:#fff;box-shadow:0 5px 0 var(--ink)}
.opt.right{background:var(--grass);color:#fff}
.opt.wrong{background:#ffb3b3;animation:shake .3s}

/* penalty */
.goal{position:relative;width:min(360px,94%);height:150px;border:8px solid #fff;border-bottom:none;outline:3px solid var(--ink);
  background:repeating-linear-gradient(45deg,#e6f7e9 0 2px,transparent 2px 14px),repeating-linear-gradient(-45deg,#e6f7e9 0 2px,transparent 2px 14px),#3a9d52;display:flex}
.zone{flex:1;background:none;border:none;display:grid;place-items:center;font-size:30px;z-index:2}
.zone span{background:rgba(255,255,255,.75);border-radius:50%;width:48px;height:48px;display:grid;place-items:center}
.keeper{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:30%;height:110px;display:flex;align-items:flex-start;justify-content:center;z-index:1;pointer-events:none}
.keeper .kb{width:44px;height:100px;background:var(--sun);border:3px solid var(--ink);border-radius:22px 22px 6px 6px;position:relative}
.keeper .kb::before{content:"";position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;background:#8d5a3b;border:3px solid var(--ink)}
.keeper .kh{font-size:26px;margin-top:22px}
.ball{font-size:40px;transition:transform .5s cubic-bezier(.2,.8,.3,1);position:relative;z-index:3}
.msg{font-family:var(--display);font-size:24px;color:var(--blue);min-height:30px}

/* banana */
.bcv{width:100%;height:220px;border:4px solid var(--ink);border-radius:14px;display:block;touch-action:manipulation}

/* bones */
.dogzone{position:relative;width:100%;height:260px;border:4px solid var(--ink);border-radius:14px;background:linear-gradient(#bfe8ff 60%,#7ccf6b 60%)}
.dog{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:70px;line-height:1}
.dog.chomp{animation:pop .3s}
.dogmsg{position:absolute;bottom:92px;left:50%;transform:translateX(-50%);background:#fff;border:3px solid var(--ink);border-radius:12px;padding:2px 10px;font-weight:800}
.bone{position:absolute;font-size:46px;background:none;border:none;padding:4px;animation:pop .25s;line-height:1}
.bone.eaten{transition:all .3s;left:46%!important;top:70%!important;transform:scale(.3);opacity:0}

/* water balloons */
.windows{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(360px,100%);padding:12px;background:#E8A87C;border:4px solid var(--ink);border-radius:10px}
.win{position:relative;aspect-ratio:1/1;max-width:100%;background:#1d3a6e;border:4px solid #fff;outline:3px solid var(--ink);border-radius:6px;overflow:hidden;padding:0}
.win img{position:absolute;left:10%;width:80%;bottom:0;transform:translateY(105%);transition:transform .15s}
.win.up img{transform:translateY(8%)}
.win.splash::after{content:"💦";position:absolute;inset:0;display:grid;place-items:center;font-size:44px;animation:pop .3s}

/* jail */
.jail{position:relative;width:200px;height:220px;border:6px solid var(--ink);border-radius:12px;background:#9aa3b5;overflow:hidden}
.jail img{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:150px;transition:transform .8s}
.bars{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 22px,#3a3f4f 22px 34px);transform:translateY(-105%);animation:drop .5s .3s cubic-bezier(.5,0,.7,1.4) forwards}
@keyframes drop{to{transform:translateY(0)}}
.lock{position:absolute;right:10px;bottom:10px;font-size:40px;opacity:0;animation:pop .4s 1s forwards;animation-fill-mode:forwards}
@keyframes show{to{opacity:1}}
.lock{animation:pop .4s 1s both, show .01s 1s forwards}
.jail.escape .bars{animation:none;transform:translateY(-105%);transition:transform .6s}
.jail.escape img{transform:translateX(160%) rotate(20deg)}
.jail.escape .lock{display:none}
#jtitle{font-family:var(--display);font-size:clamp(30px,7vw,44px);font-weight:400;color:var(--red);line-height:1.05;margin:0;text-wrap:balance}
#jtext{margin:0;font-weight:700;font-size:20px;text-wrap:balance}
.confetti{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall linear forwards;z-index:11;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}


/* escape timer + jail mode */
#mtimer{width:100%;display:flex;align-items:center;gap:8px;font-weight:800;color:var(--red)}
.tbar{flex:1;height:16px;border:3px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff}
#tfill{height:100%;width:100%;background:var(--red);transition:width .1s linear}
#mini.jailmode{background:rgba(58,20,30,.88)}
#mini.jailmode .card{background:#EEF1F7}
.step.guard{background:#6b4a9e}
/* fix the bars */
.cell{position:relative;width:min(320px,100%);height:220px;background:#26304f;border:5px solid var(--ink);border-radius:10px;display:flex;justify-content:space-evenly;overflow:hidden}
.cell img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:88%;max-width:none}
.bar{position:relative;z-index:1;width:44px;border:none;padding:0;background:linear-gradient(90deg,transparent 12px,#8a91a6 12px 32px,transparent 32px);transition:transform .2s}
.bar.bent{background:linear-gradient(90deg,transparent 12px,var(--orange) 12px 32px,transparent 32px);animation:bend .35s infinite alternate}
@keyframes bend{from{transform:skewX(-10deg)}to{transform:skewX(-22deg)}}
/* digging */
.floor{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(300px,100%);padding:10px;background:#b98a5a;border:4px solid var(--ink);border-radius:10px}
.tile{position:relative;aspect-ratio:1/1;max-width:100%;border:3px solid #8a5f36;border-radius:8px;background:#d9b384;font-size:36px;padding:0}
.tile.hole{background:#3b2a1a}
.tile.hole::before{content:"🥄";display:inline-block;animation:bend .3s infinite alternate}
.tile.filled::before{content:"✅"}
/* tug of war */
.tug{display:flex;align-items:center;gap:8px;width:100%}
.tface{width:64px;flex:none}
.rope{flex:1;height:12px;background:#c49a5a;border:2px solid var(--ink);border-radius:6px;position:relative}
.knot{position:absolute;top:50%;left:50%;width:28px;height:28px;background:var(--red);border:3px solid var(--ink);border-radius:50%;transform:translate(-50%,-50%)}
.tcop{font-size:52px;flex:none}
/* memory */
.cards{display:grid;gap:8px;width:min(340px,100%)}
.mcard{aspect-ratio:3/4;max-width:100%;border:4px solid var(--ink);border-radius:12px;background:var(--blue);font-size:34px;padding:0;position:relative}
.mcard span{visibility:hidden}
.mcard:not(.up)::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-family:var(--display)}
.mcard.up{background:#fff}
.mcard.up span{visibility:visible}
.mcard.match{background:#c8f2cf}
/* simon */
.simon{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:min(250px,90%)}
.sbtn{aspect-ratio:1/1;max-width:100%;border:4px solid var(--ink);border-radius:22px;opacity:.4;transition:opacity .1s,transform .1s}
.sbtn.lit{opacity:1;transform:scale(1.06)}
/* traffic light */
.tlight{display:flex;flex-direction:column;gap:8px;background:#222;padding:10px;border-radius:16px;border:4px solid var(--ink)}
.l{width:48px;height:48px;border-radius:50%;background:#444}
.l.r.on{background:#FF3B3B;box-shadow:0 0 20px #FF3B3B}
.l.y.on{background:#FFD23F;box-shadow:0 0 20px #FFD23F}
.l.g.on{background:#3DBE5A;box-shadow:0 0 20px #3DBE5A}
/* counting */
.things{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:36px;max-width:330px}
/* ducks */
.road{position:relative;width:100%;height:240px;border:4px solid var(--ink);border-radius:14px;overflow:hidden;background:linear-gradient(90deg,#fff 50%,transparent 50%) 0 50%/40px 6px repeat-x,#6b6f7a}
.duck{position:absolute;left:-60px;font-size:44px;line-height:1;background:none;border:none;padding:4px;animation:waddle linear forwards}
@keyframes waddle{from{left:-60px}to{left:100%}}
.duck.safe{animation:flyoff .5s forwards}
@keyframes flyoff{to{transform:translateY(-200px) scale(.5);opacity:0}}
/* colour code */
.cword{font-size:clamp(40px,11vw,60px)}
.cbtn{width:72px;height:72px;border-radius:50%;border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
.cbtn.right{outline:5px solid var(--grass);outline-offset:3px}
.cbtn.wrong{animation:shake .3s}


/* difficulty picker */
.modeRow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.mode{font-family:var(--display);font-size:22px;color:#fff;background:rgba(255,255,255,.12);border:4px solid rgba(255,255,255,.5);border-radius:16px;padding:6px 16px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.mode small{font-family:var(--body);font-weight:700;font-size:13px}
.mode.on{background:var(--sun);color:var(--ink);border-color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.mode[data-mode="hard"].on{background:var(--orange);color:#fff}
/* bubbles */
.sea{position:relative;width:100%;height:250px;border:4px solid var(--ink);border-radius:14px;overflow:hidden;background:linear-gradient(#d8f3ff,#5cc8ff)}
.bub{position:absolute;bottom:-80px;border-radius:50%;border:3px solid #fff;padding:0;background:radial-gradient(circle at 30% 30%,#fff 0 14%,rgba(255,255,255,.3) 40%,rgba(92,200,255,.25));animation:rise linear forwards}
@keyframes rise{to{bottom:110%}}
.bub.popped{animation:none;transform:scale(1.5);opacity:0;transition:transform .2s,opacity .2s}
/* odd one out */
.oddgrid{display:grid;gap:6px;width:min(300px,100%)}
.oddc{aspect-ratio:1/1;max-width:100%;font-size:32px;border:3px solid var(--ink);border-radius:12px;background:#fff;padding:0}
.oddc.right{background:var(--grass)}
.oddc.wrong,.stone.wrong{animation:shake .3s}
/* cups */
.cups{position:relative;width:min(340px,100%);height:190px}
.cup{position:absolute;bottom:0;width:92px;height:170px;transform:translateX(-50%);background:none;border:none;padding:0;transition-property:left;transition-timing-function:ease-in-out}
.cup img{position:absolute;bottom:4px;left:50%;width:66px;transform:translateX(-50%);visibility:hidden}
.cup.has img{visibility:visible}
.cupTop{position:absolute;bottom:0;left:0;width:92px;height:104px;border:4px solid var(--ink);border-radius:30px 30px 10px 10px;
  background:linear-gradient(#fff 0 12px,transparent 12px) 0 28px/100% 100% no-repeat,linear-gradient(90deg,#c21d1d,#ff5a5a 40%,#c21d1d);transition:transform .3s}
.cup.up .cupTop{transform:translateY(-84px)}
/* stepping stones */
.river{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(340px,100%);padding:12px;border:4px solid var(--ink);border-radius:14px;background:repeating-linear-gradient(#3aa0e0 0 10px,#4bb0ee 10px 20px)}
.stone{aspect-ratio:1/1;max-width:100%;border-radius:45%;border:3px solid var(--ink);background:#9a9a9a;font-family:var(--display);font-size:28px;color:#fff;padding:0}
.stone.stepped{background:var(--grass)}
.opt.wide{width:130px}
/* spelling, pattern, shadow */
.spellpic{font-size:56px;line-height:1}
.qmark{animation:pop .8s infinite alternate}
.shadow{font-size:110px;line-height:1.1;filter:brightness(0);transition:filter .4s}
.shadow.lit{filter:none}
/* lock dial */
.dial{position:relative;width:200px;height:200px;border-radius:50%;border:6px solid var(--ink);background:#fff}
.needle{position:absolute;left:50%;bottom:50%;width:8px;height:88px;background:var(--red);border-radius:4px 4px 0 0;transform-origin:50% 100%}
.hub{position:absolute;left:50%;top:50%;width:26px;height:26px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%)}
/* muddy window */
.screen{position:relative;width:100%;height:240px;border:6px solid #333;border-radius:24px 24px 10px 10px;overflow:hidden;touch-action:none;
  background:linear-gradient(160deg,#bfe8ff,#eef9ff 60%,#bfe8ff)}
.scrText{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:32px;color:var(--blue)}
.mud{position:absolute;background:radial-gradient(circle at 40% 40%,#8a5a2b,#5b3a1a);pointer-events:auto}

@media (prefers-reduced-motion:reduce){
  .mug img,.confetti{animation:none}
  .bars{animation-duration:.01s}
}
</style>

</head>
<body>
<div id="app">
  <div id="hud">
    <div id="lvl">Level 1</div>
    <div id="steps"></div>
    <div id="meterWrap"><span>How close?</span><div id="meter"><div id="meterFill"></div></div></div>
    <button id="mute" aria-label="Sound on or off">🔊</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="banner" hidden><b id="bannerT"></b><span id="bannerS"></span></div>
  </div>
  <div id="controls"><button class="big red" id="runBtn">RUN! 👟</button></div>

  <div class="overlay" id="title">
    <div class="titleWrap">
      <div class="poster">
        <div class="wanted">WANTED</div>
        <div class="sub">FOR BEING TOO FAST</div>
        <div class="mug"><img id="mugImg" alt="Wanted face"></div>
        <div class="faceBtns">
          <label class="fbtn" for="faceFile">📷 Choose a face</label>
          <input type="file" id="faceFile" accept="image/*" hidden>
          <button class="fbtn" id="faceReset" hidden>↩️ Cartoon face</button>
        </div>
        <label for="nameIn">His name:</label>

let AC=null, muted=false;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} } return AC }
function tone(f,d,type='square',vol=.06,delay=0,f2){
  const c=ac(); if(!c||muted) return;
  const t=c.currentTime+delay, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+d+.02);
}
function noise(d,vol=.12){
  const c=ac(); if(!c||muted) return;
  const b=c.createBuffer(1,c.sampleRate*d,c.sampleRate), a=b.getChannelData(0);
  for(let i=0;i<a.length;i++) a[i]=(Math.random()*2-1)*(1-i/a.length);
  const s=c.createBufferSource(), g=c.createGain(); g.gain.value=vol; s.buffer=b; s.connect(g).connect(c.destination); s.start();
}

const CHASE_POOL=['wall','banana','penalty','bones','traffic','ducks','maths','balloon','memory','simon','count','colour',
  'bubbles','oddone','cups','stones','bigger','spell','pattern','shadow','mud'];
const JAIL_POOL=['bars','keys','holes','tug','maths','balloon','memory','simon','count','colour',
  'cups','dial','oddone','spell','pattern','shadow','bigger'];
const JAIL_TIME=[0,40,34,30];

function newGame(){
  // deal mini games from shuffled decks so they don't repeat until the deck runs out
  const deck=pool=>{ let d=[]; return avoid=>{ if(!d.length) d=shuffle([...pool]); let i=d.findIndex(x=>!avoid.includes(x)); if(i<0) i=0; return d.splice(i,1)[0]; }; };
  const dc=deck(CHASE_POOL), dj=deck(JAIL_POOL);
  plan=[null];
  for(let L=1;L<=LAST();L++){
    const nc=HARD()?3:2, nj=HARD()?(L>=5?4:3):(L===3?3:2), p={chase:[],jail:[]};
    for(let k=0;k<nj;k++) p.jail.push(dj(p.jail));
    for(let k=0;k<nc;k++) p.chase.push(dc([...p.chase,...p.jail]));
    plan.push(p);
  }
  level=1; startLevel();
}

function loop(now){

function update(dt){

  const next=G.obs.find(o=>!o.done);

  if(next&&G.px>=next.x-80){
    G.px=next.x-80; G.mode='mini';
    startMini(next.type,()=>{ next.done=true; renderSteps(); G.rx+=120; G.mode='run'; say(pick(['Ha ha! Too slow!','Bye bye!','Nearly got me!'])); });

}

/* ---------- caught / jail ---------- */
function confetti(){
  const cols=['#FF3B3B','#FFD23F','#1F4FD1','#3DBE5A','#FF6A2B'];
  for(let i=0;i<40;i++){const s=document.createElement('span');s.className='confetti';s.style.left=Math.random()*100+'%';
    s.style.background=cols[i%5];s.style.animationDuration=(1.8+Math.random()*1.5)+'s';s.style.animationDelay=(Math.random()*.5)+'s';
    $('#app').appendChild(s);setTimeout(()=>s.remove(),4000);}
}
let jAction=null;
function showJBtn(t,fn){ $('#jbtn').textContent=t; $('#jbtn').hidden=false; jAction=fn; }
$('#jbtn').onclick=()=>{ if(jAction){ const f=jAction; jAction=null; $('#end').hidden=true; f(); } };
function resetJailCard(){ // restart the bars animation
  const jail=$('#jail'); jail.replaceWith(jail.cloneNode(true));
  $('#end').hidden=false; $('#jbtn').hidden=true; return $('#jail');
}
const who=()=>nm()==='him'?'him':nm();
function caught(){
  if(G.recapture){
    G.recapture=false; G.inJail=true; G.mode='jail'; sfx.siren(); $('#runBtn').textContent='GUARD! 👮';
    showBanner('Back in jail! 🔒','Keep guarding him!',1800,nextEscape); return;
  }
  sfx.siren(); setTimeout(()=>sfx.win(),600);
  resetJailCard(); confetti();
  $('#jtitle').textContent=`GOT YOU${nm()==='him'?'':', '+nm().toUpperCase()}!`;
  $('#jtext').textContent='Into jail you go! 🚔 Now guard the jail so he can\'t escape.';
  setTimeout(()=>showJBtn('Guard the jail! 👮',startJail),1400);
}
function levelDone(){
  G.mode='done'; sfx.win();
  const J=resetJailCard(); confetti();
  if(level<LAST()){
    $('#jtitle').textContent='He stayed in jail! ⭐';
    $('#jtext').textContent='Great guarding, officer!';
    setTimeout(()=>{
      J.classList.add('escape'); sfx.taunt();
      $('#jtitle').textContent='OH NO! A secret tunnel! 😲';
      $('#jtext').textContent=`At night ${who()} dug out and ran to ${LEVELS[level+1].name}!`;
      showJBtn('Chase him! 🚓',()=>{ $('#runBtn').textContent='RUN! 👟'; level++; startLevel(); });
    },2600);
  } else {
    $('#jtitle').textContent='LOCKED UP FOR GOOD! 🔒';
    $('#jtext').textContent=`You caught ${who()} and kept him in jail ${LAST()} times${HARD()?' on HARD mode 🔥':''}. You are a SUPER COP! ⭐⭐⭐`;
    setTimeout(()=>showJBtn('Play again 🔁',()=>{ $('#title').hidden=false; G=null; $('#runBtn').textContent='RUN! 👟'; $('#meterFill').style.width='10%'; }),1500);
  }
}
</script>
